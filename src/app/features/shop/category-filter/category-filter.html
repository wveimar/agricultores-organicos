<!--
  Barra de filtros pegajosa bajo el header. El filtrado es client-side sobre un
  `computed`: no navega ni recarga, solo recalcula la señal `visible`.
  En móvil los chips se desplazan en horizontal con scroll-snap.
-->
<div class="sticky top-16 z-40 -mx-6 border-b border-sand/70 bg-bone/85 backdrop-blur-md lg:-mx-10">
  <div class="container-shell flex flex-col gap-4 py-4 lg:flex-row lg:items-center lg:justify-between">
    <!-- Chips de categoría -->
    <div
      class="no-scrollbar -mx-6 flex snap-x snap-mandatory gap-2 overflow-x-auto px-6 lg:mx-0 lg:flex-wrap lg:px-0"
      role="tablist"
      aria-label="Filtrar por categoría"
    >
      @for (category of catalog.categories; track category.id) {
        @let isActive = catalog.activeCategory() === category.id;

        <button
          type="button"
          role="tab"
          [attr.aria-selected]="isActive"
          class="group flex shrink-0 snap-start items-center gap-2 rounded-full border px-4 py-2.5 text-sm transition-all duration-300 ease-[cubic-bezier(.22,1,.36,1)]"
          [class]="
            isActive
              ? 'border-moss bg-moss text-bone'
              : 'border-sand bg-transparent text-ink-soft hover:border-stone hover:bg-linen'
          "
          (click)="select(category.id)"
        >
          {{ category.name }}
          <!-- El contador se atenúa en reposo y gana contraste al activarse -->
          <span
            class="tabular rounded-full px-1.5 py-0.5 text-[11px] leading-none transition-colors duration-300"
            [class]="isActive ? 'bg-bone/20 text-bone' : 'bg-sand/60 text-ink-muted'"
          >
            {{ catalog.counts()[category.id] ?? 0 }}
          </span>
        </button>
      }
    </div>

    <!-- Buscar -->
    <div class="relative shrink-0">
      <label for="buscar-tienda" class="sr-only">Buscar producto</label>
      <input
        id="buscar-tienda"
        type="search"
        placeholder="Buscar producto o finca…"
        class="w-full rounded-full border border-sand bg-transparent py-2.5 pl-10 pr-4 text-sm text-ink transition-colors duration-200 placeholder:text-ink-muted hover:border-stone focus:border-moss sm:w-64"
        [value]="catalog.query()"
        (input)="onQuery($event)"
      />
      <svg
        class="pointer-events-none absolute left-3.5 top-1/2 size-4 -translate-y-1/2 text-ink-muted"
        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"
      >
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-3.5-3.5" stroke-linecap="round" />
      </svg>
    </div>
  </div>
</div>
