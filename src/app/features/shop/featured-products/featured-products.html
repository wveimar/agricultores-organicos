@if (visibles().length > 0) {
  <section id="mas-vendidos" class="container-shell scroll-mt-16 pt-20 lg:pt-28">
    <div class="flex flex-col gap-2 pb-8 lg:flex-row lg:items-end lg:justify-between">
      <div>
        <p class="text-overline font-semibold uppercase text-clay">Lo que más sale</p>
        <h2 class="mt-3 text-h2 text-ink">Más vendidos</h2>
        <p class="mt-2 max-w-xl text-ink-soft">
          Lo que las familias piden semana tras semana.
        </p>
      </div>

      @if (hayMas()) {
        <a
          href="#tienda"
          class="text-sm text-clay underline underline-offset-4 transition-colors duration-200 hover:text-clay-deep"
        >
          Ver todo el huerto
        </a>
      }
    </div>

    <!-- Misma rejilla que el catálogo: las dos usan la misma tarjeta. -->
    <div class="grid grid-cols-2 gap-x-3 gap-y-8 sm:gap-x-6 sm:gap-y-12 md:grid-cols-3 lg:gap-x-10 xl:grid-cols-4">
      @for (product of visibles(); track product.id) {
        <app-product-card [product]="product" />
      }
    </div>
  </section>
}
