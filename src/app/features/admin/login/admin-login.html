<div class="flex min-h-screen items-center justify-center bg-linen px-5 py-12">
  <div class="w-full max-w-md">
    <div class="text-center">
      <a routerLink="/" class="font-display text-2xl text-ink">
        Agricultores <span class="text-sage">Orgánicos</span>
      </a>
      <h1 class="mt-6 text-h2 text-ink">Panel de administración</h1>
      <p class="mt-2 text-sm text-ink-soft">Entra con tu cuenta de trabajo.</p>
    </div>

    <form
      class="mt-8 rounded-lg border border-sand bg-bone p-6 lg:p-8"
      [formGroup]="form"
      (ngSubmit)="submit()"
      novalidate
    >
      <!-- Correo -->
      <div>
        <label for="email" class="block text-sm font-medium text-ink">Correo</label>
        <input
          id="email"
          #errEmail="fieldError"
          type="email"
          formControlName="email"
          [appFieldError]="form.controls.email"
          autocomplete="username"
          class="mt-2 w-full rounded-md border border-sand bg-transparent px-4 py-3 text-sm text-ink transition-colors duration-200 placeholder:text-ink-muted hover:border-stone focus:border-moss"
          placeholder="tu@agricultores.co"
        />
        <app-field-error
          [for]="errEmail"
          [message]="
            form.controls.email.hasError('required')
              ? 'El correo es obligatorio.'
              : 'Escribe un correo con formato válido.'
          "
        />
      </div>

      <!-- Contraseña -->
      <div class="mt-5">
        <label for="password" class="block text-sm font-medium text-ink">Contraseña</label>
        <input
          id="password"
          #errPassword="fieldError"
          type="password"
          formControlName="password"
          [appFieldError]="form.controls.password"
          autocomplete="current-password"
          class="mt-2 w-full rounded-md border border-sand bg-transparent px-4 py-3 text-sm text-ink transition-colors duration-200 placeholder:text-ink-muted hover:border-stone focus:border-moss"
          placeholder="••••••••"
        />
        <app-field-error
          [for]="errPassword"
          [message]="
            form.controls.password.hasError('required')
              ? 'La contraseña es obligatoria.'
              : 'Debe tener al menos 8 caracteres.'
          "
        />
      </div>

      <!-- Turnstile -->
      <div class="mt-6">
        <app-turnstile [siteKey]="turnstileSiteKey()" (verified)="onVerified($event)" />
      </div>

      @if (errorMessage(); as message) {
        <p
          class="mt-5 rounded-md border border-berry/30 bg-berry/5 px-4 py-3 text-sm text-berry"
          role="alert"
        >
          {{ message }}
        </p>
      }

      <button
        type="submit"
        class="mt-6 w-full rounded-full bg-moss py-3.5 text-sm font-semibold text-bone transition-colors duration-200 hover:bg-moss-deep disabled:cursor-not-allowed disabled:opacity-60"
        [disabled]="submitting()"
      >
        {{ submitting() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>

    <p class="mt-6 text-center text-sm">
      <a
        routerLink="/admin/recuperar"
        class="text-ink-soft underline underline-offset-4 transition-colors hover:text-ink"
      >
        ¿Olvidaste tu contraseña?
      </a>
    </p>
  </div>
</div>
