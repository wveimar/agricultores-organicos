<!-- Input real, oculto: el área visible es la que recibe la interacción -->
<input
  #fileInput
  type="file"
  class="sr-only"
  [accept]="accept"
  (change)="onSelected($event)"
/>

@if (proof(); as current) {
  <!-- Estado con comprobante cargado -->
  <div class="animate-fade-in flex gap-4 rounded-lg border border-sage bg-sage-light/40 p-4">
    <img
      [src]="current.dataUrl"
      alt="Vista previa del comprobante de consignación que subiste"
      class="size-24 shrink-0 rounded-md border border-sand bg-bone object-cover"
    />

    <div class="flex min-w-0 flex-1 flex-col">
      <p class="flex items-center gap-2 text-sm font-medium text-moss-deep">
        <svg class="size-4 shrink-0" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m3 8.5 3.5 3.5L13 4.5" />
        </svg>
        Comprobante cargado
      </p>
      <p class="mt-1 truncate text-sm text-ink">{{ current.fileName }}</p>
      <p class="tabular mt-0.5 text-xs text-ink-muted">{{ sizeLabel() }}</p>

      <button
        type="button"
        class="mt-auto self-start text-sm text-clay-deep underline underline-offset-4 transition-colors duration-200 hover:text-clay"
        (click)="remove()"
      >
        Cambiar imagen
      </button>
    </div>
  </div>
} @else {
  <!--
    Zona de arrastre. El borde punteado y el cambio de color al arrastrar son
    la única señal de que aquí se puede soltar algo.
  -->
  <button
    type="button"
    class="flex w-full flex-col items-center gap-3 rounded-lg border-2 border-dashed px-6 py-10 text-center transition-all duration-300 ease-[cubic-bezier(.22,1,.36,1)]"
    [class]="
      isDragging()
        ? 'border-clay bg-clay/5 scale-[1.01]'
        : 'border-stone/70 bg-linen/50 hover:border-sage hover:bg-sage-light/30'
    "
    [disabled]="processing()"
    (click)="openPicker()"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    @if (processing()) {
      <span class="text-sm text-ink-soft">Procesando la imagen…</span>
    } @else {
      <!-- Hoja sobre obturador: cámara con lenguaje visual de la marca -->
      <svg
        class="size-10 transition-colors duration-300"
        [class]="isDragging() ? 'text-clay' : 'text-sage'"
        viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"
      >
        <path d="M5 14.5h6l2.5-3.5h13L29 14.5h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-14a2 2 0 0 1 2-2Z" stroke-linejoin="round" />
        <path d="M20 28c4 0 7-3 7-7-4.5-1.5-9 1-9 4.5 0 1 .5 2 2 2.5Z" stroke-linejoin="round" />
        <path d="M18 27.5c.5-2.5 2-4 4-5" stroke-linecap="round" />
      </svg>

      <span class="flex flex-col gap-1">
        <span class="text-base text-ink">
          {{ isDragging() ? 'Suelta la imagen aquí' : 'Arrastra tu comprobante o haz clic' }}
        </span>
        <span class="text-sm text-ink-muted">JPG, PNG o WEBP · hasta 8 MB</span>
      </span>
    }
  </button>
}

@if (error(); as message) {
  <p class="mt-3 rounded-md border border-berry/30 bg-berry/5 px-4 py-3 text-sm text-berry" role="alert">
    {{ message }}
  </p>
}
