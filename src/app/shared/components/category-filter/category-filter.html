@if (variant() === 'chips') {
  <div
    class="no-scrollbar -mx-6 flex snap-x snap-mandatory gap-2 overflow-x-auto px-6 lg:mx-0 lg:flex-wrap lg:px-0"
    role="tablist"
    [attr.aria-label]="'Filtrar por categoría'"
  >
    @for (option of options(); track option.value) {
      @let active = isActive(option.value);
      <button
        type="button"
        role="tab"
        [attr.aria-selected]="active"
        class="group flex shrink-0 snap-start items-center gap-2 rounded-full border px-4 py-2.5 text-sm transition-all duration-300 ease-[cubic-bezier(.22,1,.36,1)]"
        [class]="
          active
            ? 'border-moss bg-moss text-bone'
            : 'border-sand bg-transparent text-ink-soft hover:border-stone hover:bg-linen'
        "
        (click)="select(option.value)"
      >
        {{ option.label }}
        @if (showCounts()) {
          <span
            class="tabular rounded-full px-1.5 py-0.5 text-[11px] leading-none transition-colors duration-300"
            [class]="active ? 'bg-bone/20 text-bone' : 'bg-sand/60 text-ink-muted'"
          >
            {{ option.count ?? 0 }}
          </span>
        }
      </button>
    }
  </div>
} @else {
  <div class="relative">
    <label [for]="id()" class="text-sm text-ink-muted">Filtrar</label>
    <select
      [id]="id()"
      class="appearance-none rounded-full border border-sand bg-bone py-2.5 pl-4 pr-10 text-sm text-ink transition-colors duration-200 hover:border-stone"
      [value]="selectedValue()"
      (change)="select($any($event.target).value)"
    >
      @for (option of options(); track option.value) {
        <option [value]="option.value">{{ option.label }}</option>
      }
    </select>
    <svg
      class="pointer-events-none absolute right-3.5 top-1/2 size-4 -translate-y-1/2 text-ink-muted"
      viewBox="0 0 16 16"
      fill="none"
      stroke="currentColor"
      stroke-width="1.6"
      stroke-linecap="round"
      aria-hidden="true"
    >
      <path d="m4 6 4 4 4-4" />
    </svg>
  </div>
}
