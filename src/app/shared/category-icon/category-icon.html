<!--
  Todas comparten rejilla 24×24, trazo y remates redondos, y ninguna rellena:
  es el mismo lenguaje de los iconos que ya hay en el header y el buscador.

  `stroke-width` 1.6 y no 2: a 16 px un trazo de 2 empasta las siluetas con
  detalle (el pan, el frasco) y las convierte en manchas.
-->
<svg
  [class]="svgClass()"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.6"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
>
  @switch (resolved()) {
    <!-- Brote: tallo con dos hojas. «Todo el huerto». -->
    @case ('brote') {
      <path d="M12 21v-7" />
      <path d="M12 16c-3.3 0-6-2.7-6-6 3.3 0 6 2.7 6 6Z" />
      <path d="M12 14c0-3.9 3.1-7 7-7 0 3.9-3.1 7-7 7Z" />
    }

    <!-- Fruta: cuerpo redondo con rabo y hoja. -->
    @case ('fruta') {
      <circle cx="12" cy="14.5" r="5.8" />
      <path d="M12 8.7V5" />
      <path d="M12 6c1.1-1.9 2.9-2.6 4.6-2.2-.2 2-1.8 3.1-4.6 3.1" />
    }

    <!-- Espiga: tallo con cuatro granos enfrentados. -->
    @case ('espiga') {
      <path d="M12 21v-8.6" />
      <path d="M12 12.4c-2.2 0-3.5-1.4-3.5-3.6 2.2 0 3.5 1.4 3.5 3.6Z" />
      <path d="M12 12.4c2.2 0 3.5-1.4 3.5-3.6-2.2 0-3.5 1.4-3.5 3.6Z" />
      <path d="M12 8.6C9.8 8.6 8.5 7.2 8.5 5c2.2 0 3.5 1.4 3.5 3.6Z" />
      <path d="M12 8.6c2.2 0 3.5-1.4 3.5-3.6-2.2 0-3.5 1.4-3.5 3.6Z" />
    }

    <!-- Panal: celda hexagonal con una gota dentro. -->
    @case ('panal') {
      <path d="m12 3 7.5 4.3v8.4L12 20l-7.5-4.3V7.3Z" />
      <path d="M12 9.5c1.6 2.1 2.4 3.3 2.4 4.2a2.4 2.4 0 0 1-4.8 0c0-.9.8-2.1 2.4-4.2Z" />
    }

    <!-- Botella: cuello, hombros y una banda de etiqueta. -->
    @case ('botella') {
      <path d="M9.8 2.8h4.4" />
      <path d="M10.4 2.8v3.1c0 .8-.2 1.5-.7 2.1L8.5 9.8c-.5.6-.7 1.4-.7 2.1V19a2 2 0 0 0 2 2h4.4a2 2 0 0 0 2-2v-7.1c0-.7-.2-1.5-.7-2.1l-1.2-1.8c-.5-.6-.7-1.3-.7-2.1V2.8" />
      <path d="M7.8 13.5h8.4" />
    }

    <!-- Frasco: tapa, cuerpo y dos burbujas. Fermentos. -->
    @case ('frasco') {
      <path d="M9 2.8h6" />
      <path d="M10.2 2.8v3.3" />
      <path d="M13.8 2.8v3.3" />
      <path d="M10.2 6.1 8.6 8.3c-.5.7-.8 1.5-.8 2.4V19a2 2 0 0 0 2 2h4.4a2 2 0 0 0 2-2v-8.3c0-.9-.3-1.7-.8-2.4l-1.6-2.2Z" />
      <circle cx="10.8" cy="14.6" r=".9" />
      <circle cx="13.5" cy="17.2" r=".9" />
    }

    <!-- Pan: hogaza con tres cortes. -->
    @case ('pan') {
      <path d="M4.7 12.5c-1-1.7-.3-3.8 1.5-4.6C7.5 7.3 9.5 7 12 7s4.5.3 5.8.9c1.8.8 2.5 2.9 1.5 4.6-.4.7-1.1 1.2-1.9 1.3V18a2 2 0 0 1-2 2H8.6a2 2 0 0 1-2-2v-4.2c-.8-.1-1.5-.6-1.9-1.3Z" />
      <path d="m9.6 10.9-1.2 2.2" />
      <path d="m12.2 10.9-1.2 2.2" />
      <path d="m14.8 10.9-1.2 2.2" />
    }

    <!-- Plato servido: campana con pomo. Listos para comer. -->
    @case ('plato') {
      <path d="M3.5 18.5h17" />
      <path d="M5.2 18.5a6.8 6.8 0 0 1 13.6 0" />
      <path d="M12 11.7v-1.4" />
      <circle cx="12" cy="9" r="1.3" />
    }

    <!-- Canasta: asa, borde y dos pliegues del tejido. -->
    @case ('canasta') {
      <path d="M8.2 10a3.8 3.8 0 0 1 7.6 0" />
      <path d="M3.5 10h17" />
      <path d="m5.2 10 1.2 8.3a2 2 0 0 0 2 1.7h7.2a2 2 0 0 0 2-1.7L18.8 10" />
      <path d="m9.8 13.4.5 3.6" />
      <path d="m14.2 13.4-.5 3.6" />
    }

    <!-- Bolsa: cuerpo y asa. Despensa. -->
    @case ('bolsa') {
      <path d="M5.6 7.8h12.8l-1 11.4a2 2 0 0 1-2 1.8H8.6a2 2 0 0 1-2-1.8Z" />
      <path d="M9 7.8V6.4a3 3 0 0 1 6 0v1.4" />
    }

    <!-- Zanahoria: raíz cónica con dos hojas. Legumbres. -->
    @case ('zanahoria') {
      <path d="M9.4 9.8c0-1.9 1.2-3 2.6-3s2.6 1.1 2.6 3c0 1.4-.5 2.7-1 4.3l-1.2 6.9a.4.4 0 0 1-.8 0l-1.2-6.9c-.5-1.6-1-2.9-1-4.3Z" />
      <path d="M12 6.8V3.4" />
      <path d="M12 5c1-1.3 2.3-1.9 3.6-1.6-.2 1.4-1.5 2.3-3.6 2" />
      <path d="M12 5c-1-1.3-2.3-1.9-3.6-1.6.2 1.4 1.5 2.3 3.6 2" />
    }

    <!-- Croissant: cuerno con tres marcas de horneado. Panadería. -->
    @case ('croissant') {
      <path d="M4.5 15.3c1.3-6.6 6.4-11 12.4-10.5 2.1 5.5-.3 11.7-6 14-3 1.2-5.8.6-6.4-3.5Z" />
      <path d="m8.1 10.7 1.7 1" />
      <path d="m10.3 8.6 1.7 1" />
      <path d="m12.6 6.7 1.7 1" />
    }

    <!-- Queso: cuña con dos huecos. Lácteos. -->
    @case ('queso') {
      <path d="M3.5 17.5 9 6l11.5 6.7-2 4.8Z" />
      <path d="M3.5 17.5h17" />
      <circle cx="10.5" cy="12.5" r="1" />
      <circle cx="14.5" cy="14.3" r="1" />
    }

    <!-- Tazón: cuenco con granos asomando por el borde. Fermentos y procesados. -->
    @case ('tazon') {
      <path d="M5.6 11.5h12.8" />
      <path d="M6.3 11.5c0 4 2.5 6.9 5.7 6.9s5.7-2.9 5.7-6.9" />
      <circle cx="9.4" cy="9.6" r=".5" />
      <circle cx="12" cy="8.9" r=".5" />
      <circle cx="14.6" cy="9.6" r=".5" />
    }

    <!-- Hoja: la de por defecto. Silueta con nervio central. -->
    @default {
      <path d="M4.6 19.4C4.6 11.4 11 5 19 5c0 8-6.4 14.4-14.4 14.4Z" />
      <path d="M4.6 19.4 13.6 10.4" />
    }
  }
</svg>
